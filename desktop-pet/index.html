<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop Gf</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div style="display:flex;justify-content:center;padding:24px 0;">
<div class="app">

  <!-- title bar -->
  <div class="tbar">
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:11px;">⊡</span>
      <span class="tbar-title" id="ttitle">machi.exe</span>
    </div>
    <div class="tbar-btns">
      <button class="tbtn char active" id="btnGirl" onclick="switchChar('girl')">♀ GIRL</button>
      <button class="tbtn close" onclick="doClose()">✕</button>
    </div>
  </div>

  <!-- main row -->
  <div class="main">

    <!-- scene -->
    <div class="scene" id="scene" onclick="handlePat(event)"
      ondragover="event.preventDefault();event.currentTarget.classList.add('drag-over')"
      ondragleave="event.currentTarget.classList.remove('drag-over')"
      ondrop="handleDrop(event)">
      <div class="ground"></div>
      <div class="charwrap" id="cw">
        <div class="hearts" id="hearts"></div>
        <div class="bubble" id="bubble"></div>
        <canvas id="cv" width="96" height="120"></canvas>
      </div>
    </div>

    <!-- food tray -->
    <div class="food-tray" id="foodTray">

      <div>
        <div class="food-item" draggable="true" ondragstart="dragFood(event,'meal','🍗')">🍗</div>
        <div class="food-label">MEAL</div>
      </div>
      <div>
        <div class="food-item" draggable="true" ondragstart="dragFood(event,'snack','🍮')">🍮</div>
        <div class="food-label">SNACK</div>
      </div>
      <div>
        <div class="food-item" draggable="true" ondragstart="dragFood(event,'fruit','🍒')">🍒</div>
        <div class="food-label">FRUIT</div>
      </div>
      <div>
        <div class="food-item" draggable="true" ondragstart="dragFood(event,'love','💝')">💝</div>
        <div class="food-label">LOVE</div>
      </div>
        <div class="food-item" style="border-style:dashed;color:#aab;font-size:9px;" title="Add your item here">+</div>
        <div class="food-label">CUSTOM</div>
      </div>

    </div>
  </div>

  <!-- wardrobe -->
  <div class="wardrobe">
    <div class="ward-tabs">
      <button class="wtab active" onclick="setTab('tops')">TOPS</button>
      <button class="wtab" onclick="setTab('hair')">HAIR</button>
    </div>
    <div class="ward-body">
      <div class="item-grid" id="wardGrid"></div>
    </div>
  </div>

  <!-- stats -->
  <div class="stats">
    <span class="slabel">HUNGER</span>
    <div class="sbar-wrap"><div class="sbar hunger" id="hbar" style="width:60%"></div></div>
    <span class="slabel">HAPPY</span>
    <div class="sbar-wrap"><div class="sbar happy" id="pbar" style="width:80%"></div></div>
    <div class="mood" id="mood">( ˘ᵕ˘ )</div>
  </div>

</div>
</div>

<script src="data.js"></script>
<script src="draw.js"></script>
<script src="script.js"></script>
</body>
</html>
